onboarding = false

[theme]
name = "terminal"
auto_switch = false

[terminal]
# Same as tmux `-c "#{pane_current_path}"`: new pane/tab/workspace opens in the source pane's dir
new_cwd = "follow"

# Mirrors ~/.config/tmux/tmux.conf
[keys]
prefix = "ctrl+j"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
detach = "prefix+d"
settings = "prefix+shift+s"
edit_scrollback = ["prefix+[", "prefix+e"]

# Workspace Managemeng
new_workspace = "prefix+shift+c"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
goto = "prefix+s"
# Tab Management
new_tab = "prefix+c"
close_tab = "prefix+&"

# Pane Management
close_pane = "prefix+x"
split_vertical = ["prefix+%", "prefix+v"]
split_horizontal = ["prefix+\"", "prefix+minus"]
focus_pane_left = ["prefix+ctrl+h"]
focus_pane_down = "prefix+j"                     # prefix+ctrl+j is reserved (sends a literal ctrl+j)
focus_pane_up = ["prefix+k", "prefix+ctrl+k"]
focus_pane_right = ["prefix+ctrl+l"]
last_pane = "prefix+l"

[ui]
status_indicators = "symbols"
pane_gaps = false
pane_outer_borders = false
# Replaces tmux dracula cpu-usage/ram-usage
tab_bar_right = [
  { type = "command", command = "vmstat 1 2 | awk 'END{printf \"CPU %d%%\", 100-$15}'", interval_seconds = 5, timeout_seconds = 3 },
  { type = "command", command = "free -m | awk '/^Mem/{printf \"RAM %.1f/%.0fGB\", $3/1024, $2/1024}'", interval_seconds = 5 },
]
# "auto" draws a fake static block cursor on WSL, ignoring nvim's bar shape and blink
host_cursor = "native"
tab_bar_position = "bottom"

[ui.toast]
delivery = "herdr"

# tmux-resurrect/continuum equivalent: layout+cwd are saved to session.json automatically;
# these also bring back agent conversations and pane scrollback after a reboot
[session]
resume_agents_on_restore = true

[experimental]
pane_history = true
