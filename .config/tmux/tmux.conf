unbind r
unbind j
unbind k
unbind x

bind r source-file ~/.config/tmux/tmux.conf

bind Y setw synchronize-panes on
bind y setw synchronize-panes off

bind -N 'hint title, select pane' q {
  set -F @old-pane-borders       "#{pane-border-status}"
  set -F @old-pane-border-format "#{pane-border-format}"

  set pane-border-status top
  # set pane-border-format " [#[fg=red]#{pane_title} #[fg=blue]#{pane_current_path}#[default]] "
  set pane-border-format " [#[fg=blue]#{pane_title}#[default]] "
  display-panes

  set -F pane-border-status "#{@old-pane-borders}"
  set -F pane-border-format "#{@old-pane-border-format}"
}

set -g prefix C-j
set -g display-panes-time 5000
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm*:Tc"
set-option -g default-shell /bin/zsh
set -g mouse on
setw -g window-status-current-style 'nounderscore'

# Claude code config
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Apply vim movements to pane switching
bind-key C-h select-pane -L
bind-key C-j select-pane -D
bind-key C-k select-pane -U
bind-key C-l select-pane -R
set-window-option -g mode-keys vi

# Copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi 'Space' send -X halfpage-down
bind-key -T copy-mode-vi 'Bspace' send -X halfpage-up
 
# Silence error bells
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# Remove kill-pane confirmation
bind-key x kill-pane

# Remove kill-window confirmation
bind-key & kill-window

# Make new instances on current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Workmux
bind C-t run-shell "workmux sidebar"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'timvw/tmux-assistant-resurrect'

# tmux-continuum && tmux-resurrect configuration
set -g @continuum-restore 'on'

# Dracula Configuration
set -g @dracula-plugins "cpu-usage ram-usage"
set -g @dracula-show-powerline true
set -g @dracula-transparent-powerline-bg true
set -g @dracula-show-flags true
set -g @dracula-inverse-divider " "
set -g @dracula-show-left-sep ""

# available colors: white, gray, dark_gray, light_purple, dark_purple, cyan, green, orange, red, pink, yellow
# set -g @dracula-[plugin-name]-colors "[background] [foreground]"
set -g @dracula-cpu-usage-colors "dark_gray white"
set -g @dracula-ram-usage-colors "dark_purple white"
set -g @dracula-show-left-icon "#S"

run '~/.config/tmux/plugins/tpm/tpm'

# After tpm: tmux-assistant-resurrect overwrites this hook, so chain both scripts here
set -g @resurrect-hook-post-restore-all "bash ~/.config/tmux/scripts/workmux-restore.sh; bash ~/.config/tmux/plugins/tmux-assistant-resurrect/scripts/restore-assistant-sessions.sh"
